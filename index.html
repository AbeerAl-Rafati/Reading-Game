<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة القراءة</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4eeec;--card:#f7fbfa;--ink:#14383f;--mut:#5d7a7f;--acc:#e8a23a;--accInk:#3a2600;--line:#c5d8d5;--ok:#2e7d4f;--bad:#b5432e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2226;--card:#16323a;--ink:#e3f0ee;--mut:#8fb0b4;--acc:#f0b04c;--line:#25474f;--ok:#6fd49a;--bad:#f08a76}}
:root[data-theme="dark"]{--bg:#0f2226;--card:#16323a;--ink:#e3f0ee;--mut:#8fb0b4;--acc:#f0b04c;--line:#25474f;--ok:#6fd49a;--bad:#f08a76}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;line-height:1.7;min-height:100vh}
#app{max-width:460px;margin:0 auto;padding:22px 18px 40px}
h1,h2{font-family:Lalezar,Tajawal,sans-serif;font-weight:400;margin:0}
h1{font-size:2.6rem;line-height:1.1}
h2{font-size:1.7rem}
h3{margin:22px 0 4px;font-size:1.05rem}
p{margin:6px 0}
.mut{color:var(--mut)}
label{display:block;margin:16px 0 4px;font-weight:700}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{font:700 1.1rem Tajawal,sans-serif;background:var(--acc);color:var(--accInk);border:0;border-radius:12px;padding:12px 22px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.big{width:100%;margin-top:22px;padding:15px}
.row{display:flex;gap:10px;margin-top:14px}.row button{flex:1}
.top{display:flex;justify-content:space-between;color:var(--mut);font-weight:700}
.tree{font-size:4.2rem;text-align:center;margin-top:14px;line-height:1}
.time{font-family:Lalezar,Tajawal,sans-serif;font-size:5.6rem;text-align:center;line-height:1.1;direction:ltr}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.trail{display:flex;justify-content:space-between;margin:18px 0 6px}
.nd{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--mut)}
.nd.done{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.nd.cur{border-color:var(--acc);color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 30%,transparent)}
.pk{display:flex;gap:8px}.pk button{padding:10px 16px}
ul{list-style:none;padding:0;margin:10px 0 0}
li{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
li input{width:20px;height:20px;accent-color:var(--acc)}
li.d span{text-decoration:line-through;color:var(--mut)}
.msg{min-height:1.7em;color:var(--mut);margin-top:12px;text-align:center}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.st div{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.st b{display:block;font-family:Lalezar,Tajawal,sans-serif;font-size:2rem;font-weight:400;line-height:1.2}
@media (prefers-reduced-motion:no-preference){.nd.cur{animation:pl 1.8s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.12)}}}
.ch{display:flex;gap:4px;align-items:flex-end;height:110px;direction:ltr}
.ch div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.ch i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.ch small{font-size:.7rem;color:var(--mut)}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-top:16px}
.cr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.cr b{font-family:Lalezar,Tajawal,sans-serif;font-size:1.7rem;font-weight:400}
.bar.t{height:16px}
.gr{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin-top:10px}.gr i{aspect-ratio:1;background:var(--line);border-radius:2px;cursor:pointer}.gr i.on{background:var(--acc)}
summary{cursor:pointer;color:var(--mut);margin-top:10px}
.mr{display:grid;grid-template-columns:86px 1fr 74px;gap:8px;align-items:center;margin:8px 0;font-size:.9rem}
.b2{position:relative;height:14px;background:var(--line);border-radius:8px}.b2 i{position:absolute;top:0;bottom:0;inset-inline-start:0;background:var(--acc);border-radius:8px}.b2 u{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink);border-radius:2px}
.bd{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.bd span{border:2px solid var(--line);border-radius:20px;padding:4px 12px;font-size:.9rem;color:var(--mut);opacity:.55}.bd span.on{opacity:1;color:var(--ink);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,transparent)}
li{justify-content:space-between}li.g b{color:var(--ok)}li.b b{color:var(--bad)}
#qm:empty{display:none}
.ck{display:flex;gap:10px;align-items:center;margin:6px 0;font-weight:400}.ck input{width:20px;height:20px;accent-color:var(--acc)}
.tb{width:100%;border-collapse:collapse;font-size:.85rem}.tb th,.tb td{border:1px solid var(--line);padding:6px 8px;text-align:center}.tb th{background:var(--card);color:var(--mut)}.tb td:first-child{text-align:start;min-width:90px}
</style>
</head>

<script>
const $=i=>document.getElementById(i),app=$('app');
let S=null,OS=[],view='home',H={log:[]};

const SB_URL='https://ivzhcfbvyrzikkptavus.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2emhjZmJ2eXJ6aWtrcHRhdnVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTkzMjQsImV4cCI6MjEwNjgzNTMyNH0.V6JRJ0brlF4voAS6fxrj07pKQeEWth5XF5DhiFNQdCo';
let sb=null,U=null;
try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}
async function push(rows){if(!sb||!U||!rows.length)return;try{await sb.from('sessions').upsert(rows.map(r=>({id:r.id,t:r.t,book:r.book,mins:r.mins,pages:r.pages,dis:r.dis,pk:r.pk,stages:r.stages,user_id:U.id})),{onConflict:'user_id,id'})}catch(e){}}
async function pull(){if(!sb||!U)return;try{const{data,error}=await sb.from('sessions').select('id,t,book,mins,pages,dis,pk,stages');if(error)throw error;const ids=new Set(data.map(x=>x.id));data.forEach(x=>{const i=H.log.findIndex(y=>y.id===x.id);if(i<0)H.log.push(x);else H.log[i]=x});DB.save();await push(H.log.filter(x=>!ids.has(x.id)))}catch(e){}
 try{const r=await sb.from('page_days').select('d,n');if(!r.error){const have=new Set(r.data.map(x=>x.d));r.data.forEach(x=>H.pd[x.d]=x.n);DB.save();const loc=Object.keys(H.pd).filter(k=>!have.has(k));if(loc.length)await sb.from('page_days').upsert(loc.map(k=>({d:k,n:H.pd[k],user_id:U.id})),{onConflict:'user_id,d'})}}catch(e){}
 try{const r=await sb.from('books').select('id,data');if(!r.error){const have=new Set(r.data.map(x=>x.id));r.data.forEach(x=>{const i=H.books.findIndex(y=>y.id===x.id);if(i<0)H.books.push(x.data);else H.books[i]=x.data});DB.save();const loc=H.books.filter(b=>!have.has(b.id));if(loc.length)await sb.from('books').upsert(loc.map(b=>({id:b.id,data:b,user_id:U.id})),{onConflict:'user_id,id'})}}catch(e){}
 try{const r=await sb.from('notes').select('id,data');if(!r.error){const have=new Set(r.data.map(x=>x.id));r.data.forEach(x=>{const i=H.notes.findIndex(y=>y.id===x.id);if(i<0)H.notes.push(x.data);else H.notes[i]=x.data});DB.save();const loc=H.notes.filter(n=>!have.has(n.id));if(loc.length)await sb.from('notes').upsert(loc.map(n=>({id:n.id,data:n,user_id:U.id})),{onConflict:'user_id,id'})}}catch(e){}}
const bpt={};
function pushBook(b){if(!sb||!U)return;clearTimeout(bpt[b.id]);bpt[b.id]=setTimeout(async()=>{try{await sb.from('books').upsert({id:b.id,data:b,user_id:U.id},{onConflict:'user_id,id'})}catch(e){}},600)}
function bookPages(d){if(!d||view!=='session'||!S||!S.bid)return;const b=H.books.find(x=>x.id===S.bid);if(!b)return;b.read=Math.max(0,(b.read||0)+d);if(b.total&&b.read>=b.total&&b.status!=='done'&&b.kind!=='explore'){b.status='done';b.end=dk(Date.now())}pushBook(b)}
function pushNote(n){if(!sb||!U)return;clearTimeout(bpt['n'+n.id]);bpt['n'+n.id]=setTimeout(async()=>{try{await sb.from('notes').upsert({id:n.id,data:n,user_id:U.id},{onConflict:'user_id,id'})}catch(e){}},600)}
function addNote(x,X){const n={id:Date.now()+Math.floor(Math.random()*1000),t:Date.now(),x:x,bk:X?X.book:'',bid:X?X.bid:0,d:false};H.notes.push(n);DB.save();pushNote(n);return n}
function setNoteDone(it){const n=H.notes.find(x=>x.id===it.nid);if(n){n.d=!!it.d;DB.save();pushNote(n)}}
function syncPocket(){let ch=0;OS.forEach(X=>(X.pocket||[]).forEach(it=>{if(!it.nid){const n=addNote(it.t,X);n.d=!!it.d;it.nid=n.id;DB.save();pushNote(n);ch=1}}));if(ch)persist()}
function bookMins(X){const b=H.books.find(y=>y.id===X.bid);if(b){b.mins=(b.mins||0)+X.m;pushBook(b)}}
const ymOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const mIdx=ym=>{const a=ym.split('-');return +a[0]*12+(+a[1])-1};
const goalFor=ym=>GOAL.base+GOAL.step*Math.max(0,mIdx(ym)-mIdx(GOAL.start));
const mPages=ym=>Object.keys(H.pd).reduce((a,k)=>k.startsWith(ym+'-')?a+H.pd[k]:a,0);
let pt=null;
function addPages(k){const t=dk(Date.now());const bf=H.pd[t]||0;H.pd[t]=Math.max(0,bf+k);bookPages(H.pd[t]-bf);DB.save();if(sb&&U){clearTimeout(pt);pt=setTimeout(async()=>{try{await sb.from('page_days').upsert({d:t,n:H.pd[t]||0,user_id:U.id},{onConflict:'user_id,d'})}catch(e){}},500)}}
function pcUI(){const ym=ymOf(new Date()),c=mPages(ym),g=goalFor(ym);if($('pc'))$('pc').textContent=c+' / '+g;if($('pb'))$('pb').style.width=Math.min(100,c/g*100)+'%'}
function gmUI(){const ym=ymOf(new Date()),c=mPages(ym),g=goalFor(ym);$('gm').innerHTML=`<div class="cr"><span>هدف هالشهر</span><b>${c} / ${g}</b></div><div class="bar"><i style="width:${Math.min(100,c/g*100)}%"></i></div>`}
function saveSess(){if(!S)return;const r={id:S.id,t:S.id,book:S.book,mins:S.mins,pages:S.pages,dis:S.dis,pk:S.pk,stages:S.done};const i=H.log.findIndex(x=>x.id===S.id);if(i<0)H.log.push(r);else H.log[i]=r;DB.save();push([r])}
const pad=n=>String(n).padStart(2,'0');
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(s/60))+':'+pad(s%60)};
const cheer=['عادي، الشرود بصير. رجعتي، وهاد المهم.','كمّلي من آخر سطر، ولا تبدّي من الأول.','دقيقة وحدة بس وبترجع التركيز.','سجّلي اللي شغل بالك بالجيب وكمّلي.','شاطرة، لاحظتي حالك وهاد نص الشغل.'];
const trees=['🌱','🌿','🪴','🌳','🌳'];
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach((d,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=660+i*110;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start(a.currentTime+d);o.stop(a.currentTime+d+.18)})}catch(e){}}

function setup(){
 view='home';document.title='رحلة القراءة';
 app.innerHTML=`<h1>رحلة القراءة</h1>
 <p class="mut">قسّمي القراءة لمراحل قصيرة. بين كل مرحلة استراحة محترمة، وأي شي بدك تدوري عليه بتسجليه وبتدوري عليه بالاستراحة.</p>
 <div id="os"></div><div class="card" id="gm"></div>
 <h3>جلسة جديدة</h3><label for="bs">شو الكتاب؟</label><select id="bs"></select><div id="nbk"><input id="book" placeholder="اسم الكتاب" style="margin-top:8px"><input id="bpg" type="number" min="0" inputmode="numeric" placeholder="عدد صفحاته (اختياري)" style="margin-top:8px"><button class="ghost big" id="qa2" style="margin-top:8px">أضيفه لمكتبتي بس، بدون جلسة</button></div><p class="msg" id="qm"></p>
 <label for="n">كم مرحلة؟</label>
 <select id="n"><option>1</option><option>2</option><option>3</option><option>4</option><option selected>6</option><option>8</option></select>
 <label for="m">كم دقيقة بالمرحلة؟</label>
 <select id="m"><option>20</option><option selected>25</option><option>30</option><option>40</option></select>
 <p class="mut" id="tot"></p>
 <button class="big" id="st">يلا نبلّش الرحلة</button>
 <button class="ghost big" id="sb" style="margin-top:10px">لوحة الإنجاز</button><button class="ghost big" id="lb" style="margin-top:10px">مكتبتي</button><button class="ghost big" id="nt" style="margin-top:10px">دفتر الفضول</button>`;
 const calc=()=>{const n=+$('n').value,m=+$('m').value,t=n*m+(n-1)*5;$('tot').textContent='المجموع تقريبًا: '+Math.floor(t/60)+' ساعة و'+t%60+' دقيقة، مع الاستراحات.'};
 $('n').onchange=$('m').onchange=calc;calc();
 const bs=$('bs'),open=H.books.filter(b=>b.status!=='done').sort((a,b)=>(a.status==='reading'?0:1)-(b.status==='reading'?0:1));
 open.forEach(b=>{const o=document.createElement('option');o.value=b.id;o.textContent=(b.kind==='explore'?'🔎 ':'')+b.title;bs.append(o)});
 const o0=document.createElement('option');o0.value='0';o0.textContent='+ كتاب جديد (بينضاف لمكتبتي)';bs.append(o0);
 const o1=document.createElement('option');o1.value='-1';o1.textContent='🔎 + كتاب استكشاف جديد';bs.append(o1);
 const sel=open.find(b=>b.id===H.sel)||open[0];bs.value=sel?sel.id:0;
 const tg=()=>{const v=String(bs.value);$('nbk').style.display=(v==='0'||v==='-1')?'':'none';const xb=H.books.find(x=>String(x.id)===v);if(v==='-1'||(xb&&xb.kind==='explore')){$('n').value='2';calc()}};bs.onchange=tg;tg();
 $('sb').onclick=stats;$('lb').onclick=lib;$('nt').onclick=notes;gmUI();osUI();$('qm').textContent=qmsg;qmsg='';
 $('qa2').onclick=()=>{const t=$('book').value.trim();if(!t){$('book').focus();return}const xp=String($('bs').value)==='-1';
  const b={id:Date.now(),title:t,author:'',total:+$('bpg').value||0,subj:'',status:'want',read:0,mins:0,rating:0,notes:'',start:'',end:'',kind:xp?'explore':'full',ex:xp?mkEx():null};
  H.books.push(b);DB.save();pushBook(b);qmsg='انضاف "'+t+'" لمكتبتي'+(xp?' بقسم الاستكشاف':'')+'.';setup()};
 if(sb){const b=document.createElement('button');b.className='ghost big';b.style.marginTop='10px';
  if(U){b.textContent='تسجيل خروج ('+U.email+')';b.onclick=async()=>{try{await sb.auth.signOut()}catch(e){}U=null;try{localStorage.removeItem('rr_guest')}catch(e){}H={log:[],pd:{},books:[],notes:[]};OS=[];S=null;persist();DB.save();login()}}
  else{b.textContent='سجّلي دخول لحفظ بياناتك على الكلاود';b.onclick=()=>login()}
  app.append(b)}
 $('st').onclick=()=>{
  const bid=+$('bs').value;let bb=H.books.find(x=>x.id===bid);
  if(!bb){const t=$('book').value.trim(),xp=String($('bs').value)==='-1';if(!t){$('book').focus();return}bb={kind:xp?'explore':'full',ex:xp?mkEx():null,id:Date.now()+1,title:t,author:'',total:+$('bpg').value||0,subj:'',status:'reading',read:0,mins:0,rating:0,notes:'',start:dk(Date.now()),end:''};H.books.push(bb)}
  S={book:bb.title,bid:bb.id,n:+$('n').value,m:+$('m').value,b:5,cur:1,pocket:[],pk:0,pages:0,dis:0,mins:0,id:Date.now(),done:0};OS.forEach(pauseS);OS.push(S);
  if(bb){H.sel=bb.id;bb.status='reading';if(!bb.start)bb.start=dk(Date.now());DB.save();pushBook(bb)}
  try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}
  go('read')};
}
function setPh(ph){
 S.ph=ph;S.fired=0;S.paused=0;
 if(ph==='read'){S.c0=mPages(ymOf(new Date()));S.end=Date.now()+S.m*60000}
 if(ph==='break')S.end=Date.now()+S.b*60000;
}
function go(ph){setPh(ph);view='session';persist();render()}
function pauseS(X){if(!X.paused&&(X.ph==='read'||X.ph==='break')){X.rem=X.end-Date.now();X.paused=1;X.auto=1}}
function lab(X){const st=X.ph==='read'?'قراءة':X.ph==='break'?'استراحة':'خلصتي، سجّلي صفحاتك';const t=(X.ph==='read'||X.ph==='break')?(X.paused?' | موقوفة '+fmt(X.rem):' | '+fmt(X.end-Date.now())):'';return 'مرحلة '+X.cur+'/'+X.n+' | '+st+t}
function openSess(X){OS.forEach(o=>{if(o!==X)pauseS(o)});if(X.paused&&X.auto){X.end=Date.now()+X.rem;X.paused=0;X.auto=0}S=X;view='session';persist();render()}
function closeSess(X){const k=S;S=X;saveSess();S=k;OS=OS.filter(x=>x!==X);if(S===X)S=null;persist();setup()}
function osUI(){const el=$('os');if(!el)return;el.innerHTML='';
 OS.forEach(X=>{const d=document.createElement('div');d.className='card';
  const h=document.createElement('div');h.className='cr';const n=document.createElement('span');n.textContent=X.book;const b=document.createElement('b');b.id='os'+X.id;b.style.fontSize='1rem';b.textContent=lab(X);h.append(n,b);
  const r=document.createElement('div');r.className='row';
  const o=document.createElement('button');o.textContent='فتح';o.onclick=()=>openSess(X);
  const c=document.createElement('button');c.className='ghost';c.textContent='إغلاق';
  c.onclick=()=>{if(c.dataset.s)closeSess(X);else{c.dataset.s=1;c.textContent='متأكدة؟ اضغطي كمان مرة'}};
  r.append(o,c);d.append(h,r);el.append(d)})}
function trail(){let h='<div class="trail">';for(let i=1;i<=S.n;i++){const d=i<S.cur||(S.ph!=='read'&&i===S.cur),c=S.ph==='read'&&i===S.cur;h+=`<div class="nd ${d?'done':c?'cur':''}">${d?'✓':i}</div>`}return h+'</div>'}
function drawList(el,edit){

  if(rem<=0&&!X.fired){X.fired=1;beep();

 const tl=(lab,a,b,low)=>{if(!a&&!b)return'';const eq=a===b,up=a>b,good=up!==!!low;return `<li class="${eq?'':good?'g':'b'}"><span>${eq?'●':up?'▲':'▼'} ${lab}</span><b>${b?Math.round(Math.abs(a-b)/b*100)+'%':'جديد'}</b></li>`};
 const m1=sr(m,0,7),m2=sr(m,7,14),r1=m1?sr(ds,0,7)/(m1/60):0,r2=m2?sr(ds,7,14)/(m2/60):0;

 let streak=0;for(let i=0;i<400;i++){if(m(i)>0||pv(i)>0)streak++;else if(i>0)break}

 const days=[];for(let i=13;i>=0;i--)days.push({i,n:ago(i).getDate()});
 const chart=(t,f)=>{const mm=Math.max(1,...days.map(d=>f(d.i)));return `<h3>${t}</h3><div class="ch">${days.map(d=>`<div><i style="height:${f(d.i)/mm*100}%"></i><small>${d.n}</small></div>`).join('')}</div>`};

 app.innerHTML=`<h2>لوحة الإنجاز</h2><div id="os"></div>
 <div class="card"><div class="cr"><span>تحدي ${MN[now.getMonth()]}</span><b>${c} / ${g}</b></div>
 <div class="bar t"><i style="width:${pct}%"></i></div>

 <div class="row"><button id="p1">✓ قريت صفحة</button><button class="ghost" id="p10">+10</button><button class="ghost" id="pm">−1</button></div>
 <p class="mut">تحدي الشهر الجاي: ${goalFor(nextYm)} صفحة</p>
 <details id="dt" ${gopen?'open':''}><summary>شبكة الصفحات، اضغطي المربع التالي لتعلّميه</summary><div class="gr" id="gr">${cells}</div></details></div>
 <h3>شهر مقابل شهر</h3>${cmp}${mon}<p class="mut">الخط الغامق هو هدف الشهر.</p>
 <h3>مؤشرات</h3>${ind?`<ul>${ind}</ul>`:'<p class="mut">بتظهر بعد ما تقرأي كم يوم.</p>'}

 <div class="st"><div><b>${L.length}</b>جلسة</div><div><b>${hrs.toFixed(1)}</b>ساعة قراءة</div><div><b>${tp}</b>صفحة بالمجموع</div><div><b>${streak}</b>يوم متتالي</div>
 <div><b>${am?Math.round(mins/am):0}</b>دقيقة بمتوسط اليوم</div><div><b>${hrs?(tp/hrs).toFixed(1):0}</b>صفحة بالساعة</div>
 <div><b>${hrs?(dis/hrs).toFixed(1):0}</b>شرود بالساعة</div><div><b>${best}</b>أطول يوم بالدقايق</div></div>
 ${chart('دقايق القراءة، آخر 14 يوم',m)}${chart('الصفحات، آخر 14 يوم',pv)}
